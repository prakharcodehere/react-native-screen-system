<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="760" height="450">
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="760" height="450" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Title -->
  <text x="380" y="34" text-anchor="middle"
        font-family="'Segoe UI',system-ui,-apple-system,sans-serif"
        font-size="14" font-weight="700" fill="#0f172a" letter-spacing="-0.3">
    Screen Layout
  </text>

  <!-- ======= PHONE BODY ======= -->
  <rect x="94" y="54" width="170" height="362" rx="26" fill="#1e293b"/>
  <!-- Screen -->
  <rect x="106" y="76" width="146" height="318" rx="9" fill="#f8fafc"/>
  <!-- Status bar -->
  <rect x="106" y="76" width="146" height="24" rx="9 9 0 0" fill="#e2e8f0"/>
  <text x="116" y="91" font-family="sans-serif" font-size="7.5" font-weight="600" fill="#475569">9:41</text>
  <rect x="216" y="83" width="15" height="8" rx="1.5" fill="none" stroke="#64748b" stroke-width="1"/>
  <rect x="217" y="84" width="9" height="6" rx="0.5" fill="#64748b"/>
  <rect x="231" y="85" width="2" height="4" rx="0.5" fill="#64748b"/>
  <!-- Home indicator -->
  <rect x="154" y="404" width="50" height="3" rx="1.5" fill="#475569"/>

  <!-- ======= SCREENTAINER dashed border ======= -->
  <rect x="106" y="100" width="146" height="294" rx="0 0 9 9"
        fill="white" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="5 3"/>

  <!-- ScreenContainer chip label -->
  <rect x="134" y="103" width="90" height="17" rx="8"
        fill="white" stroke="#6366f1" stroke-width="1"/>
  <text x="179" y="115" text-anchor="middle"
        font-family="sans-serif" font-size="8.5" font-weight="700" fill="#4338ca">ScreenContainer</text>

  <!-- ======= SCREENSCROLLVIEW ======= -->
  <rect x="109" y="124" width="140" height="202" rx="4" fill="#eff6ff"/>

  <!-- Mock content rows -->
  <rect x="116" y="134" width="42" height="5.5" rx="2.75" fill="#bfdbfe"/>
  <rect x="116" y="143" width="126" height="21" rx="4" fill="white" stroke="#93c5fd" stroke-width="1"/>
  <text x="122" y="157" font-family="sans-serif" font-size="7.5" fill="#94a3b8">Email address</text>

  <rect x="116" y="171" width="50" height="5.5" rx="2.75" fill="#bfdbfe"/>
  <rect x="116" y="180" width="126" height="21" rx="4" fill="white" stroke="#93c5fd" stroke-width="1"/>
  <text x="122" y="194" font-family="sans-serif" font-size="7.5" fill="#94a3b8">Password</text>

  <rect x="116" y="208" width="36" height="5.5" rx="2.75" fill="#bfdbfe"/>
  <rect x="116" y="217" width="126" height="21" rx="4" fill="white" stroke="#93c5fd" stroke-width="1"/>
  <text x="122" y="231" font-family="sans-serif" font-size="7.5" fill="#94a3b8">Full name</text>

  <!-- Scroll indicator -->
  <rect x="245" y="130" width="2.5" height="34" rx="1.25" fill="#93c5fd" opacity="0.8"/>

  <!-- ======= STICKYACTIONBAR ======= -->
  <rect x="106" y="329" width="146" height="65" rx="0 0 5 5" fill="#e0e7ff"/>
  <line x1="106" y1="329" x2="252" y2="329" stroke="#c7d2fe" stroke-width="1"/>
  <!-- Button -->
  <rect x="115" y="337" width="128" height="29" rx="6" fill="#4f46e5"/>
  <text x="179" y="356" text-anchor="middle"
        font-family="sans-serif" font-size="10" font-weight="700" fill="white">Continue</text>
  <!-- Safe area strip -->
  <rect x="106" y="366" width="146" height="28" rx="0 0 9 9" fill="#c7d2fe" opacity="0.45"/>
  <text x="179" y="383" text-anchor="middle"
        font-family="sans-serif" font-size="7" fill="#6366f1" letter-spacing="0.5">safe area</text>

  <!-- ======= LABELS (right side) ======= -->

  <!-- Arrow: inputs → useFocusableField -->
  <line x1="242" y1="163" x2="315" y2="122" stroke="#94a3b8" stroke-width="1" marker-end="url(#arr)"/>
  <rect x="319" y="96" width="220" height="56" rx="7" fill="#fafafa" stroke="#e2e8f0" stroke-width="1"/>
  <text x="331" y="113" font-family="sans-serif" font-size="11" font-weight="700" fill="#4338ca">useFocusableField</text>
  <text x="331" y="127" font-family="sans-serif" font-size="10" fill="#475569">→ next / previous focus order</text>
  <text x="331" y="141" font-family="sans-serif" font-size="10" fill="#475569">→ auto-scroll on focus</text>

  <!-- Arrow: scrollview → ScreenScrollView -->
  <line x1="249" y1="215" x2="315" y2="210" stroke="#94a3b8" stroke-width="1" marker-end="url(#arr)"/>
  <rect x="319" y="183" width="220" height="56" rx="7" fill="#fafafa" stroke="#e2e8f0" stroke-width="1"/>
  <text x="331" y="200" font-family="sans-serif" font-size="11" font-weight="700" fill="#4338ca">ScreenScrollView</text>
  <text x="331" y="214" font-family="sans-serif" font-size="10" fill="#475569">→ scrolls focused input into view</text>
  <text x="331" y="228" font-family="sans-serif" font-size="10" fill="#475569">→ coordinates with focus system</text>

  <!-- Arrow: action bar → StickyActionBar -->
  <line x1="252" y1="350" x2="315" y2="318" stroke="#94a3b8" stroke-width="1" marker-end="url(#arr)"/>
  <rect x="319" y="292" width="220" height="56" rx="7" fill="#fafafa" stroke="#e2e8f0" stroke-width="1"/>
  <text x="331" y="309" font-family="sans-serif" font-size="11" font-weight="700" fill="#4338ca">StickyActionBar</text>
  <text x="331" y="323" font-family="sans-serif" font-size="10" fill="#475569">→ lifts above keyboard</text>
  <text x="331" y="337" font-family="sans-serif" font-size="10" fill="#475569">→ respects safe-area bottom</text>

  <!-- Bottom note -->
  <text x="380" y="434" text-anchor="middle"
        font-family="sans-serif" font-size="10" fill="#94a3b8">
    Components connect automatically inside ScreenSystemProvider — zero wiring required
  </text>
</svg>

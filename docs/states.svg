<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" width="760" height="370">

  <rect width="760" height="370" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="380" y="28" text-anchor="middle"
        font-family="'Segoe UI',system-ui,sans-serif"
        font-size="14" font-weight="700" fill="#0f172a">Screen States</text>

  <!-- ===== PHONE 1: loading ===== -->
  <rect x="48" y="44" width="130" height="238" rx="18" fill="#1e293b"/>
  <rect x="58" y="62" width="110" height="200" rx="7" fill="#f8fafc"/>
  <rect x="58" y="62" width="110" height="18" rx="7 7 0 0" fill="#e2e8f0"/>
  <text x="65" y="75" font-family="sans-serif" font-size="6.5" font-weight="600" fill="#475569">9:41</text>
  <rect x="88" y="270" width="38" height="2.5" rx="1.25" fill="#475569"/>
  <!-- Loading spinner (arc) -->
  <circle cx="113" cy="168" r="22" fill="none" stroke="#bfdbfe" stroke-width="3.5"/>
  <path d="M 113 146 A 22 22 0 0 1 135 168" fill="none" stroke="#3b82f6" stroke-width="3.5" stroke-linecap="round"/>
  <text x="113" y="208" text-anchor="middle" font-family="sans-serif" font-size="8.5" fill="#64748b">Loading...</text>

  <!-- PHONE 1 labels -->
  <text x="113" y="300" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#3b82f6">loading</text>
  <text x="113" y="315" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#94a3b8">renderLoading</text>

  <!-- ===== PHONE 2: error ===== -->
  <rect x="226" y="44" width="130" height="238" rx="18" fill="#1e293b"/>
  <rect x="236" y="62" width="110" height="200" rx="7" fill="#fff5f5"/>
  <rect x="236" y="62" width="110" height="18" rx="7 7 0 0" fill="#fee2e2"/>
  <text x="243" y="75" font-family="sans-serif" font-size="6.5" font-weight="600" fill="#475569">9:41</text>
  <rect x="266" y="270" width="38" height="2.5" rx="1.25" fill="#475569"/>
  <!-- Error icon -->
  <circle cx="291" cy="155" r="22" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="291" y="162" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="800" fill="#ef4444">!</text>
  <text x="291" y="191" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#64748b">Something went wrong</text>
  <!-- Retry button -->
  <rect x="261" y="198" width="60" height="16" rx="4" fill="#ef4444"/>
  <text x="291" y="210" text-anchor="middle" font-family="sans-serif" font-size="7.5" font-weight="600" fill="white">Try again</text>

  <!-- PHONE 2 labels -->
  <text x="291" y="300" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#ef4444">error</text>
  <text x="291" y="315" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#94a3b8">renderError</text>

  <!-- ===== PHONE 3: empty ===== -->
  <rect x="404" y="44" width="130" height="238" rx="18" fill="#1e293b"/>
  <rect x="414" y="62" width="110" height="200" rx="7" fill="#f8fafc"/>
  <rect x="414" y="62" width="110" height="18" rx="7 7 0 0" fill="#e2e8f0"/>
  <text x="421" y="75" font-family="sans-serif" font-size="6.5" font-weight="600" fill="#475569">9:41</text>
  <rect x="444" y="270" width="38" height="2.5" rx="1.25" fill="#475569"/>
  <!-- Empty state illustration -->
  <rect x="444" y="136" width="60" height="52" rx="8" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 2.5"/>
  <circle cx="465" cy="157" r="5" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="483" cy="157" r="5" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <path d="M 460 170 Q 474 165 488 170" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
  <text x="469" y="204" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#94a3b8">Nothing here yet</text>

  <!-- PHONE 3 labels -->
  <text x="469" y="300" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#94a3b8">empty</text>
  <text x="469" y="315" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#94a3b8">renderEmpty</text>

  <!-- ===== PHONE 4: content ===== -->
  <rect x="582" y="44" width="130" height="238" rx="18" fill="#1e293b"/>
  <rect x="592" y="62" width="110" height="200" rx="7" fill="#f0fdf4"/>
  <rect x="592" y="62" width="110" height="18" rx="7 7 0 0" fill="#dcfce7"/>
  <text x="599" y="75" font-family="sans-serif" font-size="6.5" font-weight="600" fill="#475569">9:41</text>
  <rect x="622" y="270" width="38" height="2.5" rx="1.25" fill="#475569"/>
  <!-- Content rows -->
  <rect x="599" y="86" width="28" height="28" rx="14" fill="#bbf7d0"/>
  <rect x="633" y="91" width="56" height="6" rx="3" fill="#86efac"/>
  <rect x="633" y="102" width="40" height="5" rx="2.5" fill="#bbf7d0"/>
  <line x1="599" y1="120" x2="694" y2="120" stroke="#dcfce7" stroke-width="1"/>
  <rect x="599" y="126" width="28" height="28" rx="14" fill="#bbf7d0"/>
  <rect x="633" y="131" width="50" height="6" rx="3" fill="#86efac"/>
  <rect x="633" y="142" width="36" height="5" rx="2.5" fill="#bbf7d0"/>
  <line x1="599" y1="160" x2="694" y2="160" stroke="#dcfce7" stroke-width="1"/>
  <rect x="599" y="166" width="28" height="28" rx="14" fill="#bbf7d0"/>
  <rect x="633" y="171" width="62" height="6" rx="3" fill="#86efac"/>
  <rect x="633" y="182" width="44" height="5" rx="2.5" fill="#bbf7d0"/>
  <line x1="599" y1="200" x2="694" y2="200" stroke="#dcfce7" stroke-width="1"/>
  <rect x="599" y="206" width="28" height="22" rx="14" fill="#bbf7d0" opacity="0.4"/>
  <rect x="633" y="210" width="46" height="6" rx="3" fill="#86efac" opacity="0.4"/>

  <!-- PHONE 4 labels -->
  <text x="647" y="300" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#22c55e">content</text>
  <text x="647" y="315" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#94a3b8">renderContent / children</text>

  <!-- Bottom note -->
  <text x="380" y="350" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#94a3b8">
    useScreenState({ loading, error, empty }) — one hook, four states, no if/else chains
  </text>
</svg>

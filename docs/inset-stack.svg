<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360">
  <defs>
    <marker id="brk" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <circle cx="3" cy="3" r="1.5" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="760" height="360" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="380" y="28" text-anchor="middle"
        font-family="'Segoe UI',system-ui,sans-serif"
        font-size="14" font-weight="700" fill="#0f172a">Bottom Spacing Anatomy — StickyActionBar</text>

  <!-- Column headers -->
  <text x="172" y="52" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#64748b">Default</text>
  <text x="516" y="52" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#64748b">Keyboard open</text>

  <!-- ==================== LEFT: Default ==================== -->

  <!-- Phone shell -->
  <rect x="82" y="60" width="180" height="278" rx="20" fill="#1e293b"/>
  <!-- Screen -->
  <rect x="94" y="74" width="156" height="248" rx="7" fill="#f8fafc"/>

  <!-- Content area (fills most of screen) -->
  <rect x="94" y="74" width="156" height="176" rx="7 7 0 0" fill="#eff6ff"/>
  <!-- Content rows -->
  <rect x="101" y="84" width="80" height="7" rx="3" fill="#bfdbfe"/>
  <rect x="101" y="96" width="142" height="6" rx="3" fill="#bfdbfe" opacity="0.6"/>
  <rect x="101" y="106" width="110" height="6" rx="3" fill="#bfdbfe" opacity="0.6"/>
  <rect x="101" y="119" width="142" height="6" rx="3" fill="#bfdbfe" opacity="0.6"/>
  <rect x="101" y="129" width="88" height="6" rx="3" fill="#bfdbfe" opacity="0.6"/>
  <rect x="101" y="142" width="142" height="6" rx="3" fill="#bfdbfe" opacity="0.6"/>
  <rect x="101" y="152" width="120" height="6" rx="3" fill="#bfdbfe" opacity="0.6"/>
  <text x="172" y="167" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#93c5fd">scroll content</text>

  <!-- Bottom gap / bottomOffset (actionBarBottomGap: 12) -->
  <rect x="94" y="250" width="156" height="14" fill="#fef9c3"/>

  <!-- StickyActionBar -->
  <rect x="94" y="264" width="156" height="30" fill="#e0e7ff"/>
  <rect x="101" y="268" width="142" height="22" rx="5" fill="#4f46e5"/>
  <text x="172" y="283" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="white">Continue</text>

  <!-- Safe area inset (bottom) -->
  <rect x="94" y="294" width="156" height="28" rx="0 0 7 7" fill="#f0fdf4"/>
  <rect x="148" y="308" width="48" height="3.5" rx="1.75" fill="#86efac"/>

  <!-- Home indicator -->
  <rect x="152" y="330" width="40" height="3" rx="1.5" fill="#475569"/>

  <!-- ==================== LEFT ANNOTATIONS ==================== -->

  <!-- content bracket -->
  <line x1="254" y1="74" x2="262" y2="74" stroke="#94a3b8" stroke-width="1"/>
  <line x1="254" y1="250" x2="262" y2="250" stroke="#94a3b8" stroke-width="1"/>
  <line x1="258" y1="74" x2="258" y2="250" stroke="#94a3b8" stroke-width="1"/>
  <text x="266" y="162" font-family="sans-serif" font-size="9" fill="#64748b">scroll</text>
  <text x="266" y="174" font-family="sans-serif" font-size="9" fill="#64748b">content</text>

  <!-- bottomOffset bracket -->
  <line x1="254" y1="250" x2="262" y2="250" stroke="#eab308" stroke-width="1"/>
  <line x1="254" y1="264" x2="262" y2="264" stroke="#eab308" stroke-width="1"/>
  <line x1="258" y1="250" x2="258" y2="264" stroke="#eab308" stroke-width="1"/>
  <text x="266" y="255" font-family="sans-serif" font-size="8.5" font-weight="600" fill="#a16207">actionBarBottomGap</text>
  <text x="266" y="266" font-family="sans-serif" font-size="8" fill="#64748b">default: 12</text>

  <!-- StickyActionBar bracket -->
  <line x1="254" y1="264" x2="262" y2="264" stroke="#6366f1" stroke-width="1"/>
  <line x1="254" y1="294" x2="262" y2="294" stroke="#6366f1" stroke-width="1"/>
  <line x1="258" y1="264" x2="258" y2="294" stroke="#6366f1" stroke-width="1"/>
  <text x="266" y="277" font-family="sans-serif" font-size="8.5" font-weight="600" fill="#4338ca">StickyActionBar</text>
  <text x="266" y="289" font-family="sans-serif" font-size="8" fill="#64748b">your CTA content</text>

  <!-- safe area bracket -->
  <line x1="254" y1="294" x2="262" y2="294" stroke="#22c55e" stroke-width="1"/>
  <line x1="254" y1="322" x2="262" y2="322" stroke="#22c55e" stroke-width="1"/>
  <line x1="258" y1="294" x2="258" y2="322" stroke="#22c55e" stroke-width="1"/>
  <text x="266" y="305" font-family="sans-serif" font-size="8.5" font-weight="600" fill="#15803d">safeAreaInset</text>
  <text x="266" y="317" font-family="sans-serif" font-size="8" fill="#64748b">home indicator zone</text>

  <!-- ==================== RIGHT: Keyboard open ==================== -->

  <!-- Phone shell -->
  <rect x="426" y="60" width="180" height="278" rx="20" fill="#1e293b"/>
  <!-- Screen -->
  <rect x="438" y="74" width="156" height="248" rx="7" fill="#f8fafc"/>

  <!-- Content area (shorter — keyboard takes space) -->
  <rect x="438" y="74" width="156" height="80" rx="7 7 0 0" fill="#eff6ff"/>
  <rect x="445" y="84" width="80" height="7" rx="3" fill="#bfdbfe"/>
  <rect x="445" y="96" width="142" height="6" rx="3" fill="#bfdbfe" opacity="0.6"/>
  <rect x="445" y="106" width="100" height="6" rx="3" fill="#bfdbfe" opacity="0.6"/>
  <text x="516" y="125" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#93c5fd">scroll content</text>

  <!-- bottomOffset gap -->
  <rect x="438" y="154" width="156" height="12" fill="#fef9c3"/>

  <!-- StickyActionBar LIFTED above keyboard -->
  <rect x="438" y="166" width="156" height="30" fill="#e0e7ff"/>
  <rect x="445" y="170" width="142" height="22" rx="5" fill="#4f46e5"/>
  <text x="516" y="185" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="white">Continue</text>

  <!-- Keyboard height layer -->
  <rect x="438" y="196" width="156" height="126" rx="0 0 7 7" fill="#cbd5e1"/>
  <!-- Key rows simplified -->
  <rect x="442" y="202" width="13" height="9" rx="1.5" fill="white" opacity="0.8"/>
  <rect x="458" y="202" width="13" height="9" rx="1.5" fill="white" opacity="0.8"/>
  <rect x="474" y="202" width="13" height="9" rx="1.5" fill="white" opacity="0.8"/>
  <rect x="490" y="202" width="13" height="9" rx="1.5" fill="white" opacity="0.8"/>
  <rect x="506" y="202" width="13" height="9" rx="1.5" fill="white" opacity="0.8"/>
  <rect x="522" y="202" width="13" height="9" rx="1.5" fill="white" opacity="0.8"/>
  <rect x="538" y="202" width="13" height="9" rx="1.5" fill="white" opacity="0.8"/>
  <rect x="554" y="202" width="13" height="9" rx="1.5" fill="white" opacity="0.8"/>
  <rect x="570" y="202" width="13" height="9" rx="1.5" fill="white" opacity="0.8"/>
  <rect x="447" y="215" width="13" height="9" rx="1.5" fill="white" opacity="0.8"/>
  <rect x="463" y="215" width="13" height="9" rx="1.5" fill="white" opacity="0.8"/>
  <rect x="479" y="215" width="13" height="9" rx="1.5" fill="white" opacity="0.8"/>
  <rect x="495" y="215" width="13" height="9" rx="1.5" fill="white" opacity="0.8"/>
  <rect x="511" y="215" width="13" height="9" rx="1.5" fill="white" opacity="0.8"/>
  <rect x="527" y="215" width="13" height="9" rx="1.5" fill="white" opacity="0.8"/>
  <rect x="543" y="215" width="13" height="9" rx="1.5" fill="white" opacity="0.8"/>
  <rect x="442" y="228" width="20" height="9" rx="1.5" fill="#b0bac7"/>
  <rect x="465" y="228" width="13" height="9" rx="1.5" fill="white" opacity="0.8"/>
  <rect x="481" y="228" width="13" height="9" rx="1.5" fill="white" opacity="0.8"/>
  <rect x="497" y="228" width="13" height="9" rx="1.5" fill="white" opacity="0.8"/>
  <rect x="513" y="228" width="13" height="9" rx="1.5" fill="white" opacity="0.8"/>
  <rect x="529" y="228" width="13" height="9" rx="1.5" fill="white" opacity="0.8"/>
  <rect x="545" y="228" width="20" height="9" rx="1.5" fill="#b0bac7"/>
  <rect x="442" y="241" width="24" height="9" rx="1.5" fill="#b0bac7"/>
  <rect x="470" y="241" width="76" height="9" rx="2" fill="white" opacity="0.9"/>
  <rect x="550" y="241" width="36" height="9" rx="1.5" fill="#6366f1" opacity="0.85"/>
  <!-- Home indicator inside keyboard -->
  <rect x="491" y="258" width="50" height="3" rx="1.5" fill="#94a3b8" opacity="0.5"/>

  <!-- ==================== RIGHT ANNOTATIONS ==================== -->

  <!-- keyboard bracket -->
  <line x1="598" y1="196" x2="606" y2="196" stroke="#64748b" stroke-width="1"/>
  <line x1="598" y1="322" x2="606" y2="322" stroke="#64748b" stroke-width="1"/>
  <line x1="602" y1="196" x2="602" y2="322" stroke="#64748b" stroke-width="1"/>
  <text x="610" y="248" font-family="sans-serif" font-size="8.5" font-weight="600" fill="#475569">keyboard</text>
  <text x="610" y="260" font-family="sans-serif" font-size="8" fill="#64748b">height</text>

  <!-- StickyActionBar bracket right -->
  <line x1="598" y1="166" x2="606" y2="166" stroke="#6366f1" stroke-width="1"/>
  <line x1="598" y1="196" x2="606" y2="196" stroke="#6366f1" stroke-width="1"/>
  <line x1="602" y1="166" x2="602" y2="196" stroke="#6366f1" stroke-width="1"/>
  <text x="610" y="175" font-family="sans-serif" font-size="8.5" font-weight="600" fill="#4338ca">lifted above</text>
  <text x="610" y="187" font-family="sans-serif" font-size="8.5" font-weight="600" fill="#4338ca">keyboard</text>

  <!-- Bottom note -->
  <text x="380" y="348" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#94a3b8">
    keyboardAware on StickyActionBar slides the bar up — content scrolls to stay visible
  </text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" width="760" height="410">
  <rect width="760" height="410" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="380" y="28" text-anchor="middle"
        font-family="'Segoe UI',system-ui,sans-serif"
        font-size="14" font-weight="700" fill="#0f172a">Safe Area &amp; Edge-to-Edge</text>

  <text x="165" y="54" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#ef4444">Without handling</text>
  <text x="546" y="54" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#22c55e">With ScreenContainer</text>

  <text x="340" y="222" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#e2e8f0">vs</text>

  <!-- ===== LEFT PHONE ===== -->
  <rect x="82" y="62" width="166" height="302" rx="22" fill="#1e293b"/>
  <rect x="94" y="78" width="142" height="270" rx="8" fill="#fff5f5"/>
  <!-- Status bar danger zone -->
  <rect x="94" y="78" width="142" height="26" rx="8 8 0 0" fill="#fee2e2"/>
  <!-- Dynamic island -->
  <rect x="136" y="84" width="60" height="12" rx="6" fill="#fca5a5"/>
  <!-- Content bleeding into status bar -->
  <rect x="100" y="82" width="56" height="8" rx="3" fill="#f87171" opacity="0.8"/>
  <text x="128" y="90" text-anchor="middle" font-family="sans-serif" font-size="6" fill="#7f1d1d">Screen Title</text>
  <!-- Danger stripes top -->
  <line x1="94" y1="104" x2="236" y2="104" stroke="#ef4444" stroke-width="1" stroke-dasharray="3 2" opacity="0.6"/>

  <!-- Content rows -->
  <rect x="100" y="112" width="88" height="8" rx="3" fill="#fca5a5" opacity="0.9"/>
  <rect x="100" y="125" width="130" height="6" rx="3" fill="#fca5a5" opacity="0.4"/>
  <rect x="100" y="135" width="98" height="6" rx="3" fill="#fca5a5" opacity="0.4"/>
  <rect x="100" y="148" width="130" height="6" rx="3" fill="#fca5a5" opacity="0.4"/>
  <rect x="100" y="158" width="72" height="6" rx="3" fill="#fca5a5" opacity="0.4"/>
  <rect x="100" y="171" width="130" height="6" rx="3" fill="#fca5a5" opacity="0.4"/>
  <rect x="100" y="181" width="110" height="6" rx="3" fill="#fca5a5" opacity="0.4"/>

  <!-- CTA button overlapping home zone -->
  <rect x="100" y="316" width="130" height="22" rx="5" fill="#ef4444" opacity="0.75"/>
  <text x="165" y="331" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="600" fill="white">Continue</text>
  <!-- Home bar danger zone -->
  <rect x="94" y="324" width="142" height="24" rx="0 0 8 8" fill="#fee2e2"/>
  <rect x="143" y="333" width="44" height="3.5" rx="1.75" fill="#fca5a5"/>
  <!-- Overlap highlight -->
  <rect x="94" y="324" width="142" height="14" fill="#ef4444" opacity="0.18"/>
  <!-- Danger stripe bottom -->
  <line x1="94" y1="324" x2="236" y2="324" stroke="#ef4444" stroke-width="1" stroke-dasharray="3 2" opacity="0.6"/>
  <!-- Home indicator -->
  <rect x="145" y="355" width="40" height="3" rx="1.5" fill="#475569"/>

  <!-- Error badges -->
  <circle cx="82" cy="91" r="9" fill="#ef4444"/>
  <text x="82" y="95.5" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="900" fill="white">!</text>
  <circle cx="82" cy="335" r="9" fill="#ef4444"/>
  <text x="82" y="339.5" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="900" fill="white">!</text>

  <!-- captions below left phone -->
  <text x="165" y="377" text-anchor="middle" font-family="sans-serif" font-size="8.5" fill="#ef4444">Title hidden under notch</text>
  <text x="165" y="390" text-anchor="middle" font-family="sans-serif" font-size="8.5" fill="#ef4444">Button behind home indicator</text>

  <!-- ===== RIGHT PHONE ===== -->
  <rect x="463" y="62" width="166" height="302" rx="22" fill="#1e293b"/>
  <rect x="475" y="78" width="142" height="270" rx="8" fill="#f0fdf4"/>
  <!-- Status bar safe zone -->
  <rect x="475" y="78" width="142" height="26" rx="8 8 0 0" fill="#dcfce7"/>
  <!-- Dynamic island -->
  <rect x="517" y="84" width="60" height="12" rx="6" fill="#86efac"/>
  <!-- Dashed safe top boundary -->
  <line x1="475" y1="104" x2="617" y2="104" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5 3"/>

  <!-- Content rows properly below safe area -->
  <rect x="481" y="110" width="88" height="8" rx="3" fill="#22c55e" opacity="0.95"/>
  <rect x="481" y="123" width="130" height="6" rx="3" fill="#86efac" opacity="0.7"/>
  <rect x="481" y="133" width="98" height="6" rx="3" fill="#86efac" opacity="0.7"/>
  <rect x="481" y="146" width="130" height="6" rx="3" fill="#86efac" opacity="0.7"/>
  <rect x="481" y="156" width="72" height="6" rx="3" fill="#86efac" opacity="0.7"/>
  <rect x="481" y="169" width="130" height="6" rx="3" fill="#86efac" opacity="0.7"/>
  <rect x="481" y="179" width="110" height="6" rx="3" fill="#86efac" opacity="0.7"/>

  <!-- CTA properly above safe bottom boundary -->
  <rect x="481" y="304" width="130" height="18" rx="5" fill="#22c55e"/>
  <text x="546" y="317" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="600" fill="white">Continue</text>
  <!-- Dashed safe bottom boundary -->
  <line x1="475" y1="326" x2="617" y2="326" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5 3"/>
  <!-- Home bar safe zone -->
  <rect x="475" y="326" width="142" height="22" rx="0 0 8 8" fill="#dcfce7"/>
  <rect x="524" y="335" width="44" height="3.5" rx="1.75" fill="#86efac"/>
  <!-- Home indicator -->
  <rect x="526" y="355" width="40" height="3" rx="1.5" fill="#475569"/>

  <!-- Success badges -->
  <circle cx="463" cy="91" r="9" fill="#22c55e"/>
  <text x="463" y="95.5" text-anchor="middle" font-family="sans-serif" font-size="10" fill="white">✓</text>
  <circle cx="463" cy="335" r="9" fill="#22c55e"/>
  <text x="463" y="339.5" text-anchor="middle" font-family="sans-serif" font-size="10" fill="white">✓</text>

  <!-- ANNOTATIONS right of right phone -->
  <!-- Top inset bracket -->
  <line x1="620" y1="78" x2="630" y2="78" stroke="#94a3b8" stroke-width="1"/>
  <line x1="620" y1="104" x2="630" y2="104" stroke="#94a3b8" stroke-width="1"/>
  <line x1="625" y1="78" x2="625" y2="104" stroke="#94a3b8" stroke-width="1"/>
  <text x="635" y="87" font-family="sans-serif" font-size="9.5" font-weight="600" fill="#4338ca">includeTopInset</text>
  <text x="635" y="101" font-family="sans-serif" font-size="8.5" fill="#64748b">status bar + notch</text>

  <!-- Bottom inset bracket -->
  <line x1="620" y1="326" x2="630" y2="326" stroke="#94a3b8" stroke-width="1"/>
  <line x1="620" y1="348" x2="630" y2="348" stroke="#94a3b8" stroke-width="1"/>
  <line x1="625" y1="326" x2="625" y2="348" stroke="#94a3b8" stroke-width="1"/>
  <text x="635" y="335" font-family="sans-serif" font-size="9.5" font-weight="600" fill="#4338ca">includeBottomInset</text>
  <text x="635" y="349" font-family="sans-serif" font-size="8.5" fill="#64748b">+ safeAreaAware</text>

  <!-- captions below right phone -->
  <text x="546" y="377" text-anchor="middle" font-family="sans-serif" font-size="8.5" fill="#22c55e">Title visible below notch</text>
  <text x="546" y="390" text-anchor="middle" font-family="sans-serif" font-size="8.5" fill="#22c55e">Button above home indicator</text>

  <!-- Bottom note -->
  <text x="380" y="407" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#94a3b8">
    System insets absorbed automatically — no manual padding needed in your screens
  </text>
</svg>

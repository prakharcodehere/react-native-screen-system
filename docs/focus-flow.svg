<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430">
  <defs>
    <marker id="arr2" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#6366f1"/>
    </marker>
    <marker id="arr3" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="760" height="430" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="380" y="28" text-anchor="middle"
        font-family="'Segoe UI',system-ui,sans-serif"
        font-size="14" font-weight="700" fill="#0f172a">Focus Navigation — useFocusableField</text>

  <!-- ===== PHONE ===== -->
  <rect x="70" y="48" width="180" height="366" rx="24" fill="#1e293b"/>
  <rect x="83" y="65" width="154" height="334" rx="8" fill="#f8fafc"/>
  <!-- Status bar -->
  <rect x="83" y="65" width="154" height="22" rx="8 8 0 0" fill="#e2e8f0"/>
  <text x="93" y="80" font-family="sans-serif" font-size="7.5" font-weight="600" fill="#475569">9:41</text>
  <!-- Home indicator -->
  <rect x="142" y="389" width="50" height="3" rx="1.5" fill="#475569"/>

  <!-- Screen title -->
  <text x="160" y="104" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0f172a">Create Account</text>

  <!-- Field 1: Full Name — FOCUSED -->
  <text x="90" y="121" font-family="sans-serif" font-size="7.5" fill="#475569">Full Name</text>
  <rect x="90" y="125" width="127" height="22" rx="4" fill="white" stroke="#4f46e5" stroke-width="2"/>
  <text x="96" y="140" font-family="sans-serif" font-size="7.5" fill="#1e293b">Prakhar|</text>
  <!-- Order badge 1 -->
  <circle cx="225" cy="136" r="9" fill="#4f46e5"/>
  <text x="225" y="139.5" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="700" fill="white">1</text>

  <!-- Field 2: Email -->
  <text x="90" y="163" font-family="sans-serif" font-size="7.5" fill="#475569">Email</text>
  <rect x="90" y="167" width="127" height="22" rx="4" fill="white" stroke="#cbd5e1" stroke-width="1"/>
  <text x="96" y="182" font-family="sans-serif" font-size="7.5" fill="#94a3b8">email@example.com</text>
  <!-- Order badge 2 -->
  <circle cx="225" cy="178" r="9" fill="#a5b4fc"/>
  <text x="225" y="181.5" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#3730a3">2</text>

  <!-- Field 3: Password -->
  <text x="90" y="205" font-family="sans-serif" font-size="7.5" fill="#475569">Password</text>
  <rect x="90" y="209" width="127" height="22" rx="4" fill="white" stroke="#cbd5e1" stroke-width="1"/>
  <text x="96" y="224" font-family="sans-serif" font-size="7.5" fill="#94a3b8">••••••••</text>
  <!-- Order badge 3 -->
  <circle cx="225" cy="220" r="9" fill="#a5b4fc"/>
  <text x="225" y="223.5" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#3730a3">3</text>

  <!-- Field 4: Phone — last field -->
  <text x="90" y="247" font-family="sans-serif" font-size="7.5" fill="#475569">Phone</text>
  <rect x="90" y="251" width="127" height="22" rx="4" fill="white" stroke="#cbd5e1" stroke-width="1"/>
  <text x="96" y="266" font-family="sans-serif" font-size="7.5" fill="#94a3b8">+1 (555) ···</text>
  <!-- Order badge 4 with "Done" hint -->
  <circle cx="225" cy="262" r="9" fill="#a5b4fc"/>
  <text x="225" y="265.5" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="700" fill="#3730a3">4</text>

  <!-- Focus chain arrows (left of fields) -->
  <line x1="79" y1="148" x2="79" y2="162" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="79" y1="190" x2="79" y2="204" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="79" y1="232" x2="79" y2="246" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arr2)"/>

  <!-- Keyboard block -->
  <rect x="83" y="285" width="154" height="114" rx="0 0 8 8" fill="#cbd5e1"/>
  <!-- Key row 1 -->
  <rect x="87" y="291" width="12" height="10" rx="1.5" fill="white" opacity="0.85"/>
  <rect x="102" y="291" width="12" height="10" rx="1.5" fill="white" opacity="0.85"/>
  <rect x="117" y="291" width="12" height="10" rx="1.5" fill="white" opacity="0.85"/>
  <rect x="132" y="291" width="12" height="10" rx="1.5" fill="white" opacity="0.85"/>
  <rect x="147" y="291" width="12" height="10" rx="1.5" fill="white" opacity="0.85"/>
  <rect x="162" y="291" width="12" height="10" rx="1.5" fill="white" opacity="0.85"/>
  <rect x="177" y="291" width="12" height="10" rx="1.5" fill="white" opacity="0.85"/>
  <rect x="192" y="291" width="12" height="10" rx="1.5" fill="white" opacity="0.85"/>
  <rect x="207" y="291" width="12" height="10" rx="1.5" fill="white" opacity="0.85"/>
  <rect x="222" y="291" width="12" height="10" rx="1.5" fill="white" opacity="0.85"/>
  <!-- Key row 2 -->
  <rect x="93" y="305" width="12" height="10" rx="1.5" fill="white" opacity="0.85"/>
  <rect x="108" y="305" width="12" height="10" rx="1.5" fill="white" opacity="0.85"/>
  <rect x="123" y="305" width="12" height="10" rx="1.5" fill="white" opacity="0.85"/>
  <rect x="138" y="305" width="12" height="10" rx="1.5" fill="white" opacity="0.85"/>
  <rect x="153" y="305" width="12" height="10" rx="1.5" fill="white" opacity="0.85"/>
  <rect x="168" y="305" width="12" height="10" rx="1.5" fill="white" opacity="0.85"/>
  <rect x="183" y="305" width="12" height="10" rx="1.5" fill="white" opacity="0.85"/>
  <rect x="198" y="305" width="12" height="10" rx="1.5" fill="white" opacity="0.85"/>
  <rect x="213" y="305" width="12" height="10" rx="1.5" fill="white" opacity="0.85"/>
  <!-- Key row 3 -->
  <rect x="87" y="319" width="18" height="10" rx="1.5" fill="#b0bac7"/>
  <rect x="109" y="319" width="12" height="10" rx="1.5" fill="white" opacity="0.85"/>
  <rect x="124" y="319" width="12" height="10" rx="1.5" fill="white" opacity="0.85"/>
  <rect x="139" y="319" width="12" height="10" rx="1.5" fill="white" opacity="0.85"/>
  <rect x="154" y="319" width="12" height="10" rx="1.5" fill="white" opacity="0.85"/>
  <rect x="169" y="319" width="12" height="10" rx="1.5" fill="white" opacity="0.85"/>
  <rect x="184" y="319" width="12" height="10" rx="1.5" fill="white" opacity="0.85"/>
  <rect x="199" y="319" width="18" height="10" rx="1.5" fill="#b0bac7"/>
  <!-- Key row 4: Next button highlighted -->
  <rect x="87" y="333" width="22" height="10" rx="1.5" fill="#b0bac7"/>
  <rect x="113" y="333" width="74" height="10" rx="2" fill="white" opacity="0.9"/>
  <!-- "Next" key — highlighted -->
  <rect x="191" y="333" width="40" height="10" rx="2" fill="#4f46e5"/>
  <text x="211" y="341.5" text-anchor="middle" font-family="sans-serif" font-size="6.5" font-weight="700" fill="white">Next</text>
  <!-- Home indicator inside keyboard -->
  <rect x="135" y="351" width="50" height="3" rx="1.5" fill="#94a3b8" opacity="0.5"/>

  <!-- ===== RIGHT SIDE ANNOTATIONS ===== -->

  <!-- Flow sequence visual -->
  <text x="320" y="68" font-family="sans-serif" font-size="11" font-weight="700" fill="#0f172a">Tab order</text>
  <!-- Circles -->
  <circle cx="320" cy="94" r="14" fill="#4f46e5"/>
  <text x="320" y="98.5" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="white">1</text>
  <line x1="334" y1="94" x2="354" y2="94" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arr2)"/>
  <circle cx="370" cy="94" r="14" fill="#818cf8"/>
  <text x="370" y="98.5" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="white">2</text>
  <line x1="384" y1="94" x2="404" y2="94" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arr2)"/>
  <circle cx="420" cy="94" r="14" fill="#818cf8"/>
  <text x="420" y="98.5" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="white">3</text>
  <line x1="434" y1="94" x2="454" y2="94" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arr2)"/>
  <circle cx="470" cy="94" r="14" fill="#818cf8"/>
  <text x="470" y="98.5" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="white">4</text>
  <line x1="484" y1="94" x2="504" y2="94" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arr2)"/>
  <!-- Submit box -->
  <rect x="507" y="81" width="44" height="26" rx="5" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="529" y="97" text-anchor="middle" font-family="sans-serif" font-size="8.5" font-weight="600" fill="#16a34a">submit</text>

  <!-- Divider -->
  <line x1="300" y1="118" x2="750" y2="118" stroke="#f1f5f9" stroke-width="1"/>

  <!-- Prop explanations -->
  <text x="300" y="141" font-family="sans-serif" font-size="10" font-weight="700" fill="#0f172a">useFocusableField props</text>

  <!-- order -->
  <rect x="300" y="150" width="54" height="18" rx="4" fill="#eff6ff"/>
  <text x="327" y="163" text-anchor="middle" font-family="'Courier New',monospace" font-size="9.5" font-weight="700" fill="#1d4ed8">order</text>
  <text x="362" y="163" font-family="sans-serif" font-size="9.5" fill="#475569">field sequence — lower = first</text>

  <!-- blurOnSubmit -->
  <rect x="300" y="174" width="90" height="18" rx="4" fill="#eff6ff"/>
  <text x="345" y="187" text-anchor="middle" font-family="'Courier New',monospace" font-size="9.5" font-weight="700" fill="#1d4ed8">blurOnSubmit</text>
  <text x="398" y="187" font-family="sans-serif" font-size="9.5" fill="#475569">last field dismisses keyboard</text>

  <!-- autoScrollOnFocus -->
  <rect x="300" y="198" width="118" height="18" rx="4" fill="#eff6ff"/>
  <text x="359" y="211" text-anchor="middle" font-family="'Courier New',monospace" font-size="9.5" font-weight="700" fill="#1d4ed8">autoScrollOnFocus</text>
  <text x="426" y="211" font-family="sans-serif" font-size="9.5" fill="#475569">scrolls input into view</text>

  <!-- nextId / previousId -->
  <rect x="300" y="222" width="57" height="18" rx="4" fill="#eff6ff"/>
  <text x="328.5" y="235" text-anchor="middle" font-family="'Courier New',monospace" font-size="9.5" font-weight="700" fill="#1d4ed8">nextId</text>
  <text x="365" y="235" font-family="sans-serif" font-size="9.5" fill="#475569">jump to non-sequential field</text>

  <!-- Divider 2 -->
  <line x1="300" y1="252" x2="750" y2="252" stroke="#f1f5f9" stroke-width="1"/>

  <!-- focusSelf / focusNext etc -->
  <text x="300" y="272" font-family="sans-serif" font-size="10" font-weight="700" fill="#0f172a">Programmatic control</text>

  <rect x="300" y="280" width="72" height="18" rx="4" fill="#f0fdf4"/>
  <text x="336" y="293" text-anchor="middle" font-family="'Courier New',monospace" font-size="9.5" font-weight="700" fill="#15803d">focusNext()</text>
  <text x="380" y="293" font-family="sans-serif" font-size="9.5" fill="#475569">move to next field</text>

  <rect x="300" y="304" width="90" height="18" rx="4" fill="#f0fdf4"/>
  <text x="345" y="317" text-anchor="middle" font-family="'Courier New',monospace" font-size="9.5" font-weight="700" fill="#15803d">focusFirstInvalid()</text>
  <text x="398" y="317" font-family="sans-serif" font-size="9.5" fill="#475569">jump to first invalid field on submit</text>

  <rect x="300" y="328" width="72" height="18" rx="4" fill="#f0fdf4"/>
  <text x="336" y="341" text-anchor="middle" font-family="'Courier New',monospace" font-size="9.5" font-weight="700" fill="#15803d">focusSelf()</text>
  <text x="380" y="341" font-family="sans-serif" font-size="9.5" fill="#475569">focus this field imperatively</text>

  <!-- Bottom note -->
  <text x="380" y="418" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#94a3b8">
    The "Next" key on the keyboard automatically calls focusNext() — no onSubmitEditing wiring needed
  </text>
</svg>
